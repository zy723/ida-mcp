[project]
name = "ida-mcp"
version = "20261008.0.1"
description = "Official Hex-Rays IDA MCP Server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "packaging",
    "ida-nexus>=0.13.4",
    "zeromcp>=1.10.3",
]

[project.urls]
Repository = "https://github.com/HexRaysSA/ida-mcp"
Issues = "https://github.com/HexRaysSA/ida-mcp/issues"

[project.scripts]
ida-mcp = "ida_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.12.0",
    "ty>=0.0.83",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["ida_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# The runtime bundle is ported verbatim from ida-pro-mcp (see
# ida_mcp/pro/NOTICE); keeping it close to upstream wins over house style.
exclude = ["ida_mcp/pro/runtime"]

[tool.ruff.lint.per-file-ignores]
# These tests exec the generated installer program and the runtime bundle —
# that IS the code under test.
"tests/test_pro_bootstrap.py" = ["S102"]
"tests/test_pro_signature_parity.py" = ["S102"]

[tool.ty.src]
# Same rationale as the ruff exclude: the ported bundle follows upstream.
exclude = ["ida_mcp/pro/runtime"]
